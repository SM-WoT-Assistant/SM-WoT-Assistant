<!DOCTYPE html>

<header>

<main>

<!-- Upload Modal -->
<div id="upload-modal" class="modal-overlay">
    <div class="modal">

        <label>Нікнейм</label>

            <button class="btn" onclick="closeUpload()">Скасувати</button>

let currentLang = (localStorage.getItem("site_lang") || "ua");

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem("site_lang", lang);
    document.getElementById("lang-ua").style.background = lang === "ua" ? "#ff4500" : "#333";
    document.getElementById("lang-ua").style.color = lang === "ua" ? "#fff" : "#ccc";
    document.getElementById("lang-en").style.background = lang === "en" ? "#ff4500" : "#333";
    document.getElementById("lang-en").style.color = lang === "en" ? "#fff" : "#ccc";
    const mapSel = document.getElementById("map-filter");
    mapSel.innerHTML = '<option value="">Всі мапи / All maps</option>';
    const mapKeys = Object.keys(MAP_NAMES[currentLang] || MAP_NAMES["en"]);
    mapKeys.sort().forEach(id => {
        mapSel.innerHTML += `<option value="${id}">${mapLabel(id)}</option>`;
    });
    loadSchemes();
}

function mapLabel(id) { return (MAP_NAMES[currentLang] || MAP_NAMES["en"])[id] || id; }

// ═══ State ═══
let allSchemes = [];
let allAuthors = new Set();
let allMaps = new Set();

function init() {
    const mapSel = document.getElementById("map-filter");
    const mapKeys = Object.keys(MAP_NAMES[currentLang] || MAP_NAMES["ua"]);
    mapKeys.sort().forEach(id => {
        mapSel.innerHTML += `<option value="${id}">${mapLabel(id)}</option>`;
    });
    // Auto-fill nickname from URL
    const params = new URLSearchParams(window.location.search);
    const nickParam = params.get("nick");
    if (nickParam) {
        document.getElementById("upload-nick").value = decodeURIComponent(nickParam);
    }
    setLang(currentLang);
    loadSchemes();
}

function loadSchemes() {
    db.ref("schemes").orderByChild("created_at").limitToLast(200).once("value")
        .then(snap => {
            allSchemes = [];
            allAuthors.clear();
            allMaps.clear();
            const data = snap.val();
            if (data) {
                Object.values(data).forEach(s => {
                    allSchemes.push(s);
                    allAuthors.add(s.author_nickname);
                    allMaps.add(s.map_id);
                });
                allSchemes.sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
            }
            const authSel = document.getElementById("author-filter");
            authSel.innerHTML = '<option value="">Всі автори</option>';
            [...allAuthors].sort().forEach(a => {
                authSel.innerHTML += `<option value="${a}">${a}</option>`;
            });
            document.getElementById("stats").textContent =
                `${allSchemes.length} схем · ${allAuthors.size} авторів · ${allMaps.size} мап`;
            renderSchemes(allSchemes);
        })
        .catch(() => {
            document.getElementById("schemes-table").innerHTML =
                '<div class="empty">Помилка завантаження. Спробуйте пізніше.</div>';
        });
}

function renderSchemes(schemes) {
    const container = document.getElementById("schemes-table");
    if (!schemes.length) {
        container.innerHTML = '<div class="empty">Немає опублікованих схем. <a href="#" onclick="openUpload()" style="color:#ffaa00">Опублікувати першу!</a></div>';
        return;
    }
    let html = '<table><tr><th>Мапа</th><th>Назва</th><th>Автор</th><th>Дата</th><th>Елем.</th><th></th></tr>';
    schemes.forEach(s => {
        html += `<tr>
            <td class="scheme-map" title="${(s.map_id || '')}">${mapLabel(s.map_id) || s.map_name || ''}</td>
            <td style="color:#ffaa00;font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${(s.title || '').replace(/"/g, '&quot;')}">${s.title || '—'}</td>
            <td class="scheme-author">${s.author_nickname || '—'}</td>
            <td class="scheme-date">${(s.created_at || '').slice(0, 16)}</td>
            <td class="scheme-count">${s.element_count || 0}</td>
            <td class="scheme-actions">
                <button class="btn btn-sm" onclick="deleteScheme('${s.drawing_id || ''}')" title="Видалити">🗑</button>
                <button class="btn btn-sm" onclick="downloadScheme('${s.drawing_id || ''}')">⬇ JSON</button>
                <button class="btn btn-sm btn-blue" onclick="downloadAuthorSchemes('${s.author_nickname || ''}')">⬇ Автор</button>
            </td>
        </tr>`;
    });
    html += '</table>';
    container.innerHTML = html;
}

function filterSchemes() {
    const mapVal = document.getElementById("map-filter").value;
    const authorVal = document.getElementById("author-filter").value;
    let filtered = allSchemes;
    if (mapVal) filtered = filtered.filter(s => s.map_id === mapVal || s.map_name === mapVal);
    if (authorVal) filtered = filtered.filter(s => s.author_nickname === authorVal);
    document.getElementById("stats").textContent =
        `${filtered.length} / ${allSchemes.length} схем`;
    renderSchemes(filtered);
}

// ═══ Download ═══

function downloadJSON(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("Завантажено: " + filename);
}

function downloadScheme(drawingId) {
    const s = allSchemes.find(x => x.drawing_id === drawingId);
    if (!s) { toast("Схему не знайдено", true); return; }
    const data = {
        map_id: s.map_id,
        map_name: s.map_name || mapLabel(s.map_id),
        title: s.title || "",
        comment: s.comment || "",
        author: s.author_nickname,
        elements: typeof s.elements === "string" ? JSON.parse(s.elements) : (s.elements || [])
    };
    downloadJSON(data, `${mapLabel(s.map_id)}_${s.author_nickname || "anon"}.json`);
}

function downloadAuthorSchemes(nickname) {
    const schemes = allSchemes.filter(s => s.author_nickname === nickname);
    if (!schemes.length) { toast("Немає схем цього автора", true); return; }
    const data = {
        author: nickname,
        scheme_count: schemes.length,
        schemes: schemes.map(s => ({
            map_id: s.map_id,
            map_name: s.map_name || mapLabel(s.map_id),
            elements: typeof s.elements === "string" ? JSON.parse(s.elements) : (s.elements || []),
            created_at: s.created_at
        }))
    };
    downloadJSON(data, `schemes_by_${nickname}.json`);
}

// ═══ Upload ═══

function openUpload() { document.getElementById("upload-modal").classList.add("active"); }
function closeUpload() {
    document.getElementById("upload-modal").classList.remove("active");
    document.getElementById("upload-file").value = "";
    document.getElementById("upload-count").textContent = "";
}
function updateUploadCount() {
    const f = document.getElementById("upload-file");
    document.getElementById("upload-count").textContent =
        f.files.length ? `Вибрано файлів: ${f.files.length}` : "";
}

async function doUpload() {
    const nick = document.getElementById("upload-nick").value.trim();
    const pin = document.getElementById("upload-pin").value.trim();
    const title = document.getElementById("upload-title").value.trim();
    const comment = document.getElementById("upload-comment").value.trim();
    const files = document.getElementById("upload-file").files;

    if (!nick) { toast("Введіть нікнейм", true); return; }
    if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) { toast("PIN має бути рівно 4 цифри", true); return; }
    if (!title) { toast("Введіть назву схеми", true); return; }
    if (!files.length) { toast("Виберіть JSON файл(и)", true); return; }

    let pinHash;
    try { pinHash = await hashPin(pin); } catch (e) { toast("Помилка хешування PIN", true); return; }

    let uploaded = 0;
    let errors = 0;

    const processNext = (idx) => {
        if (idx >= files.length) {
            if (uploaded) {
                let msg = `Опубліковано: ${uploaded} схем(и)`;
                if (errors) msg += `, помилок: ${errors}`;
                toast(msg);
                closeUpload();
                setTimeout(loadSchemes, 1000);
            }
            return;
        }

        const file = files[idx];
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const data = JSON.parse(reader.result);
                const mapId = data.map_id;
                if (!mapId) {
                    errors++;
                    processNext(idx + 1);
                    return;
                }
                let elements = data.drawings || data.elements || data;
                if (Array.isArray(elements)) {
                    // ok
                } else if (Array.isArray(data.drawings)) {
                    elements = data.drawings;
                } else {
                    throw new Error("Не знайдено масив елементів");
                }
                const drawingId = "web_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
                const scheme = {
                    drawing_id: drawingId,
                    map_id: mapId,
                    map_name: mapLabel(mapId),
                    author_nickname: nick,
                    pin_hash: pinHash,
                    title: title,
                    comment: comment,
                    elements: JSON.stringify(elements),
                    element_count: elements.length,
                    created_at: new Date().toISOString().replace("T", " ").slice(0, 19)
                };
                db.ref("schemes/" + drawingId).set(scheme)
                    .then(() => { uploaded++; processNext(idx + 1); })
                    .catch(() => { errors++; processNext(idx + 1); });
            } catch (e) {
                errors++;
                processNext(idx + 1);
            }
        };
        reader.readAsText(file);
    };

    processNext(0);
}

// ═══ SHA256 Hash (same salt as firebase_identity.py) ═══
async function hashPin(pin) {
    const msg = new TextEncoder().encode("wot_assistant_pin_salt_" + pin);
    const hash = await crypto.subtle.digest("SHA-256", msg);
    return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// ═══ Delete ═══
async function deleteScheme(drawingId) {
    const s = allSchemes.find(x => x.drawing_id === drawingId);
    if (!s) { toast("Схему не знайдено", true); return; }

    const pin = prompt("Введіть ваш PIN (4 цифри) для видалення схеми:\n\nМапа: " + mapLabel(s.map_id) + "\nНазва: " + (s.title || "—"));
    if (!pin || pin.length !== 4 || !/^\d{4}$/.test(pin)) { toast("PIN має бути 4 цифри", true); return; }

    let pinHash;
    try { pinHash = await hashPin(pin); } catch (e) { toast("Помилка хешування", true); return; }

    if (pinHash !== s.pin_hash) {
        toast("Невірний PIN! Видалення відхилено.", true);
        return;
    }

    db.ref("schemes/" + drawingId).remove()
        .then(() => {
            toast("Схему видалено.");
            setTimeout(loadSchemes, 500);
        })
        .catch(() => toast("Помилка видалення.", true));
}

// ═══ Toast ═══

let toastTimer;
function toast(msg, isError) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = "toast"; }, 3000);
}

init();
</script>
