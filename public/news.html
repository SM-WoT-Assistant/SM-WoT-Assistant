<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM WoT Assistant — News</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; color: #ccc; line-height: 1.6; }
        .top-nav { background: #111; border-bottom: 1px solid #222; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .top-nav .logo { color: #ff4500; text-decoration: none; font-size: 16px; font-weight: bold; }
        .top-nav .logo:hover { color: #ff5722; }
        .top-nav nav { display: flex; gap: 4px; }
        .top-nav nav a { color: #aaa; text-decoration: none; padding: 6px 14px; border-radius: 4px; font-size: 13px; transition: all .2s; }
        .top-nav nav a:hover { background: #222; color: #fff; }
        .top-nav nav a.active { background: #ff4500; color: #fff; }
        main { max-width: 820px; margin: 0 auto; padding: 32px 24px; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .filter-btn { background: #222; color: #888; border: 1px solid #333; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all .2s; }
        .filter-btn:hover { background: #333; color: #ccc; }
        .filter-btn.active { background: #ff4500; color: #fff; border-color: #ff4500; }
        .news-card { background: #151515; border: 1px solid #222; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; }
        .news-card.pinned { border-color: #ffaa00; }
        .news-card.pinned::before { content: ''; display: inline-block; width: 8px; height: 8px; background: #ffaa00; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
        .news-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
        .news-title { font-size: 18px; color: #ff4500; }
        .news-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .news-date { color: #888; font-size: 13px; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 11px; font-weight: bold; }
        .badge-release { background: #335533; color: #66cc66; }
        .badge-announcement { background: #334455; color: #6699cc; }
        .badge-update { background: #555533; color: #ffcc66; }
        .news-content { color: #bbb; font-size: 14px; line-height: 1.3; }
        .news-content p { margin: 0; }
        .news-content h2 { color: #ffaa00; font-size: 16px; margin: 8px 0 3px; }
        .news-content h3 { color: #ffaa00; font-size: 14px; margin: 6px 0 2px; }
        .news-content hr { border: none; border-top: 1px solid #333; margin: 6px 0; }
        .news-content ul { margin: 2px 0 2px 20px; }
        .news-content li { margin-bottom: 1px; }
        .news-content a { color: #7ab; text-decoration: none; }
        .news-content a:hover { color: #9cf; text-decoration: underline; }
        .news-content code { background: #222; padding: 2px 6px; border-radius: 3px; font-size: 13px; color: #ffaa00; }
        .news-content pre { background: #111; border: 1px solid #222; border-radius: 6px; padding: 12px; overflow-x: auto; margin: 8px 0; }
        .news-content pre code { background: none; padding: 0; }
        .github-link { display: inline-block; margin-top: 12px; background: #333; color: #ccc; padding: 6px 16px; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .github-link:hover { background: #444; color: #fff; }
        .spoiler-wrap { position: relative; }
        .spoiler-wrap.collapsed { max-height: 100px; overflow: hidden; }
        .spoiler-wrap.collapsed::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50px; background: linear-gradient(transparent, #0a0a0a); pointer-events: none; }
        .spoiler-btn { display: inline-block; margin-top: 8px; color: #7ab; font-size: 13px; cursor: pointer; border: none; background: none; padding: 0; }
        .spoiler-btn:hover { color: #9cf; text-decoration: underline; }
        .empty { text-align: center; color: #555; padding: 60px 20px; font-size: 15px; }
        footer { text-align: center; padding: 40px 24px; color: #555; font-size: 13px; border-top: 1px solid #111; margin-top: 40px; }
        footer a { color: #777; text-decoration: none; }
        footer a:hover { color: #aaa; }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="index.html" class="logo">SM WoT Assistant</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="news.html" class="active">News</a>
        <a href="schemes.html">Schemes</a>
    </nav>
</nav>

<main>
    <div class="filter-bar" id="filter-bar">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="release">Releases</button>
        <button class="filter-btn" data-filter="announcement">Announcements</button>
        <button class="filter-btn" data-filter="update">Updates</button>
    </div>
    <div id="news-list">
        <div class="empty">Loading news...</div>
    </div>
</main>

<footer>
    <p>SM WoT Assistant &copy; 2026 &nbsp;&middot;&nbsp;
    <a href="https://sm-wot-assistant.web.app">sm-wot-assistant.web.app</a> &nbsp;&middot;&nbsp;
    <a href="https://www.reddit.com/user/SM-WoT-Assistant/" target="_blank" rel="noopener">Reddit</a></p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
    apiKey: "AIzaSyBbZTPygDttChnbxbRB1xfHOACiHN2YStE",
    authDomain: "sm-wot-assistant.firebaseapp.com",
    databaseURL: "https://sm-wot-assistant-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "sm-wot-assistant",
    storageBucket: "sm-wot-assistant.firebasestorage.app",
    messagingSenderId: "154255345343",
    appId: "1:154255345343:web:270af95b541878e2f9e80a",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allNews = [];
let currentFilter = 'all';

function renderMarkdown(text) {
    if (!text) return '';
    let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

    // Code blocks (``` ... ```)
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
        return '<pre><code>' + code.trim() + '</code></pre>';
    });

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Headers
    html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');

    // Bold
    html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');

    // Links [text](url)
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // Unordered lists
    html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');

    // Paragraphs (double newlines) — replace with single <br>, not double
    html = html.replace(/\n\n/g, '\n');

    // Single newlines to <br>
    html = html.replace(/\n/g, '<br>');

    // Collapse any sequence of <br> into one
    html = html.replace(/(<br>\s*){2,}/g, '<br>');

    // Remove <br> inside <ul> (list items have their own spacing)
    html = html.replace(/<ul><br>/g, '<ul>');
    html = html.replace(/<br><\/ul>/g, '</ul>');
    html = html.replace(/<li><br>/g, '<li>');
    html = html.replace(/<\/li><br><li>/g, '</li><li>');
    html = html.replace(/<\/li><br>/g, '</li>');
    html = html.replace(/<br><li>/g, '<li>');
    // Remove <br> around headers
    html = html.replace(/<br>(<h[23]>)/g, '$1');
    html = html.replace(/(<\/h[23]>)<br>/g, '$1');
    // Remove <br> around horizontal rules
    html = html.replace(/<br>---<br>/g, '<hr style="border:none;border-top:1px solid #333;margin:6px 0;">');
    html = html.replace(/<br>---/g, '<hr style="border:none;border-top:1px solid #333;margin:6px 0;">');
    html = html.replace(/---<br>/g, '<hr style="border:none;border-top:1px solid #333;margin:6px 0;">');

    // Clean empty paragraphs
    html = html.replace(/<p>\s*<\/p>/g, '');
    html = html.replace(/<p>\s*(<h[23]>)/g, '$1');
    html = html.replace(/(<\/h[23]>)\s*<\/p>/g, '$1');
    html = html.replace(/<p>\s*(<ul>)/g, '$1');
    html = html.replace(/(<\/ul>)\s*<\/p>/g, '$1');
    html = html.replace(/<p>\s*(<pre>)/g, '$1');
    html = html.replace(/(<\/pre>)\s*<\/p>/g, '$1');
    // Strip any leftover <p> wrapping
    html = html.replace(/<\/?p>/g, '');

    return html;
}

function typeBadge(type) {
    const cls = {
        'release': 'badge-release',
        'announcement': 'badge-announcement',
        'update': 'badge-update'
    }[type] || 'badge-announcement';
    const label = type ? type.charAt(0).toUpperCase() + type.slice(1) : 'News';
    return `<span class="badge ${cls}">${label}</span>`;
}

function renderNews() {
    const container = document.getElementById('news-list');
    let filtered = allNews;
    if (currentFilter !== 'all') {
        filtered = allNews.filter(n => n.type === currentFilter);
    }

    if (!filtered.length) {
        container.innerHTML = '<div class="empty">No news found.</div>';
        return;
    }

    let html = '';
    filtered.forEach(n => {
        const pinned = n.pinned ? ' pinned' : '';
        const date = (n.created_at || '').slice(0, 10);
        const ghLink = n.github_url
            ? `<a href="${n.github_url}" target="_blank" rel="noopener" class="github-link">View on GitHub</a>`
            : '';

        const contentLen = (n.content || '').length;
        const isLong = contentLen > 500;
        const spoilerClass = isLong ? ' spoiler-wrap collapsed' : '';
        const spoilerBtn = isLong
            ? `<button class="spoiler-btn" onclick="toggleSpoiler(this)">Show full ↓</button>`
            : '';

        html += `<div class="news-card${pinned}" id="news-${n._key}">
            <div class="news-header">
                <div class="news-title">${n.title || 'Untitled'}</div>
                <div class="news-meta">
                    ${typeBadge(n.type)}
                    <span class="news-date">${date}</span>
                </div>
            </div>
            <div class="news-content${spoilerClass}">${renderMarkdown(n.content)}</div>
            ${spoilerBtn}
            ${ghLink}
        </div>`;
    });
    container.innerHTML = html;
}

function loadNews() {
    db.ref("news").orderByChild("created_at").once("value")
        .then(snap => {
            const data = snap.val();
            if (!data) {
                allNews = [];
                renderNews();
                return;
            }
            allNews = Object.entries(data)
                .map(([key, val]) => ({ ...val, _key: key }))
                .sort((a, b) => {
                    // Pinned first, then by date descending
                    if (a.pinned && !b.pinned) return -1;
                    if (!a.pinned && b.pinned) return 1;
                    return (b.created_at || '').localeCompare(a.created_at || '');
                });
            renderNews();
        })
        .catch(() => {
            document.getElementById('news-list').innerHTML =
                '<div class="empty">Failed to load news.</div>';
        });
}

// Filter buttons
document.getElementById('filter-bar').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderNews();
});

// Handle hash anchor (e.g. news.html#news_1_0_79)
function scrollToHash() {
    if (window.location.hash) {
        const el = document.querySelector(window.location.hash);
        if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }
}

loadNews();
window.addEventListener('hashchange', scrollToHash);

function toggleSpoiler(btn) {
    const card = btn.closest('.news-card');
    const content = card.querySelector('.news-content');
    if (content.classList.contains('collapsed')) {
        content.classList.remove('collapsed');
        btn.textContent = 'Show less ↑';
    } else {
        content.classList.add('collapsed');
        btn.textContent = 'Show full ↓';
    }
}
</script>

</body>
</html>
